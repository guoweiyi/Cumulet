# =============================================================================
# Cumulet — One-click deployment (bundled MySQL via Docker)
#
#   cd deploy
#   cp .env.example .env   # fill in passwords / secrets
#   docker compose up -d
#
# The app image is pulled from IMAGE (default: Docker Hub). Override it in .env if
# you mirror the image to your own registry.
# =============================================================================
name: cumulet

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cumulet}
      MYSQL_USER: ${MYSQL_USER:-cumulet}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published by default — only the app needs it. Uncomment to inspect:
    # ports:
    #   - "3306:3306"

  app:
    image: ${IMAGE:-xiaoxiaoyunmiao/cumulet:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "${DOCKER_DATABASE_URL:-mysql://${MYSQL_USER:-cumulet}:${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}@db:3306/${MYSQL_DATABASE:-cumulet}}"
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in .env}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?set APP_ENCRYPTION_KEY (64 hex chars) in .env}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-zh}
      AI_CRON_ENABLED: ${AI_CRON_ENABLED:-true}
      LIFECYCLE_CRON_ENABLED: ${LIFECYCLE_CRON_ENABLED:-true}
      ALLOW_PRIVATE_OUTBOUND_WEBHOOKS: ${ALLOW_PRIVATE_OUTBOUND_WEBHOOKS:-false}
      # First-boot seeding (set to true once, then unset):
      SEED_ON_START: ${SEED_ON_START:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  db_data:
  app_data:
